{% extends "base.html" %}

{% block title %}Login - AgroSan{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    <h2>Acessar o Sistema</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Usuário:</label>
            <input type="text" name="username" required style="width: 100%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Senha:</label>
            <input type="password" name="password" required style="width: 100%; padding: 8px;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background-color: #2e7d32; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Entrar
        </button>
    </form>
    <p style="margin-top: 15px; text-align: center;">
        Não possui conta? <a href="{{ url_for('register') }}">Cadastre-se</a>
    </p>
</div>
{% endblock %}
