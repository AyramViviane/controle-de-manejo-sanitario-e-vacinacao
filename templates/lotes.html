{% extends "base.html" %}

{% block title %}Cadastro de Lote{% endblock %}

{% block content %}

<h2>Cadastro de Lote</h2>

<form method="POST">

    <label for="codigo">Código do lote:</label>
    <input type="text"
           id="codigo"
           name="codigo"
           required>

    <label for="quantidade">Quantidade de animais:</label>
    <input type="number"
           id="quantidade"
           name="quantidade"
           min="1"
           required>

    <label for="especie">Espécie:</label>
    <input type="text"
           id="especie"
           name="especie"
           required>

    <label for="data_formacao">Data de formação:</label>
    <input type="date"
           id="data_formacao"
           name="data_formacao">

    <button type="submit">Cadastrar Lote</button>

</form>

{% endblock %}
